[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stoopid-c"
version = "0.1.0"
description = "The Stoopid C interpreter"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
stoopid = "stoopid_c.cli:main"

[tool.setuptools]
packages = ["stoopid_c"]
